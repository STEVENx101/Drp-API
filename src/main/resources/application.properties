spring.application.name=drp-api
server.port=${SERVER_PORT:8080}

# DRP DATABASE
spring.datasource.url=jdbc:mysql://intdb.fintrex.test:3306/drp?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Test@-123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${DRP_DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DRP_DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DRP_DB_CONNECTION_TIMEOUT_MS:10000}


spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false

# Keep SQL logging off by default
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
security.jwt.secret=${DRP_JWT_SECRET:_i1lctVdt0cqLwvIb3QioM_QgMvcBhkfi1gH-jJyXx_CPplsMEnjeknwIAWzsQRQ}
security.jwt.expiration-seconds=${DRP_JWT_EXPIRATION_SECONDS:3600}
security.jwt.issuer=${DRP_JWT_ISSUER:fintrex-drp-api}

# USERNAME / PASSWORD AUTHENTICATION
drp.api.username=${DRP_API_USERNAME:fintrex-user}
drp.api.password=${DRP_API_PASSWORD:fintrex-password}
drp.api.scope=${DRP_API_SCOPE:drp-api}

# SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-default.html
springdoc.swagger-ui.persist-authorization=true

server.error.include-message=never



drp.uat.image-override.enabled=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
